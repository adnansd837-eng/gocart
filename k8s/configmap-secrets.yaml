apiVersion: v1
kind: ConfigMap
metadata:
  name: gocart-config
  labels:
    app: gocart
data:
  NODE_ENV: "production"
  PORT: "5000"
  FRONTEND_PORT: "3000"
  POSTGRES_DB: "gocart"
  POSTGRES_HOST: "gocart-postgres"
  POSTGRES_PORT: "5432"
  CORS_ORIGIN: "http://localhost:3000"
  NEXT_PUBLIC_CURRENCY_SYMBOL: "$"
  NEXT_PUBLIC_API_URL: "http://gocart-backend:5000/api"
---
apiVersion: v1
kind: Secret
metadata:
  name: gocart-secrets
  labels:
    app: gocart
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres_secure_password"
  DATABASE_URL: "postgresql://postgres:postgres_secure_password@gocart-postgres:5432/gocart?schema=public"
