apiVersion: apps/v1
kind: Deployment
metadata:
  name: gocart-frontend
  labels:
    app: gocart-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gocart-frontend
  template:
    metadata:
      labels:
        app: gocart-frontend
    spec:
      containers:
        - name: frontend
          image: gocart-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_CURRENCY_SYMBOL
              valueFrom:
                configMapKeyRef:
                  name: gocart-config
                  key: NEXT_PUBLIC_CURRENCY_SYMBOL
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: gocart-config
                  key: NEXT_PUBLIC_API_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gocart-frontend
  labels:
    app: gocart-frontend
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
      name: http
  selector:
    app: gocart-frontend
