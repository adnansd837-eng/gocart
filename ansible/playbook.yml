---
- name: Deploy GoCart with Docker Compose
  hosts: servers
  become: yes

  tasks:
    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Pull or build GoCart containers
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        build: always
